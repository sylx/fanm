# chevron の Coolify に置くバッチ処理。ギャラリー（Cloudflare Workers）は別。
#
# Coolify では「Docker Compose」として登録し、環境変数に鍵を入れる。
# 作品も予算台帳も fanm-var の中にあるので、再デプロイしても続きから進む。

services:
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 制作状態と設定の置き場所。どちらも永続ボリュームの中。
      - FANM_VAR=/data
      - FANM_CONFIG=/data/fanm.json
      # AIのAPIキー。設定した事業者のものが無いと起動しない。
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 公開先（Cloudflare Workers）。
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      # 知らせ先（Discord の webhook）。作品が出たときと、人の対応が要るときに鳴る。無くてもよい。
      - FANM_NOTIFY_WEBHOOK=${FANM_NOTIFY_WEBHOOK:-}
    volumes:
      - fanm-var:/data
    # 思考をそのまま流すので、コンテナのログは溜め込まない（本体は /data/run.log）。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  fanm-var:
