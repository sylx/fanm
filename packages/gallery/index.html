<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fanM - AIが無限にMSX2風のデモを作り続けるサイト</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <style>
    :root { color-scheme: dark; --bg: #0b0b10; --fg: #e8e6f0; --dim: #8d89a5; --line: #23222e; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 16px 48px; background: var(--bg); color: var(--fg);
           font: 15px/1.6 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; max-width: 1100px;
             margin: 0 auto; padding: 24px 0 16px; }
    h1 { margin: 0; line-height: 0; }
    /* 題字はロゴの絵そのもの。高さだけ決めて、幅は絵の比に任せる。 */
    h1 img { height: 34px; width: auto; display: block; }
    header p { color: var(--dim); margin: 0; font-size: 13px; }
    a { color: inherit; }
    main { max-width: 1100px; margin: 0 auto; }
    #stage { margin: 0 0 32px; }
    /* VDP の一画面は 272x228。同じ比にしておくと、プレイヤーが整数倍で
       出したときの余白が最小で済む。 */
    #stage iframe { width: min(100%, 818px); aspect-ratio: 272 / 228; margin: 0 auto;
                    border: 1px solid var(--line); background: #000; display: block; }
    #bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
           margin: 0; padding: 8px 0; color: var(--dim); font-size: 13px; }
    #close { white-space: nowrap; text-decoration: none; padding: 2px 8px;
             border: 1px solid var(--line); border-radius: 4px; }
    #close:hover, #close:focus-visible { color: var(--fg); border-color: var(--fg); }
    ul { list-style: none; display: grid; gap: 16px; padding: 0; margin: 0;
         grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    /* 紹介文は途中で切らずに全部出す。高さは行ごとに揃えたいので、カードは
       升目いっぱいに伸ばし、日付を最後の行に落として下端を合わせる。 */
    .card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px;
            width: 100%; height: 100%; text-align: left; cursor: pointer;
            background: none; border: 1px solid var(--line); border-radius: 6px;
            padding: 8px; color: inherit; font: inherit; }
    .card:hover, .card:focus-visible { border-color: var(--fg); }
    .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block;
                background: #000; border-radius: 3px; }
    .card strong { font-weight: 600; letter-spacing: .08em; }
    .card span { color: var(--dim); font-size: 13px; }
    /* 最後の行。日付は左、書いたAIの名前は右。名前が長いときは字を詰める
       ばかりで、日付を押し出さない。 */
    .card .foot { display: flex; align-items: baseline; justify-content: space-between;
                  gap: 8px; color: var(--dim); font-size: 12px; padding-top: 4px; }
    .card time { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .card .model { font-size: 11px; letter-spacing: .04em; text-align: right;
                   overflow-wrap: anywhere; }
    /* iPhone のような細い画面では升目が一列きりになり、絵を字の上に敷くと
       一枚で画面がほとんど埋まってしまう。絵を小さくして左へ寄せ、字をその
       右に回り込ませて、一枚あたりの縦を詰める。絵は行をまたいで立てに通し、
       字は右の列だけを上から順に使う。 */
    @media (max-width: 560px) {
      ul { grid-template-columns: 1fr; gap: 12px; }
      .card { grid-template-columns: 104px 1fr; grid-template-rows: auto 1fr auto;
              column-gap: 10px; }
      .card img { grid-column: 1; grid-row: 1 / -1; align-self: start; }
      .card strong, .card span, .card .foot { grid-column: 2; }
    }
    /* 継ぎ足しの押しどころ。並べ終えたら隠れるので、余白ごと畳まれるよう
       升目の外に独立して置く。 */
    #more { display: block; margin: 24px auto 0; padding: 8px 24px; cursor: pointer;
            background: none; border: 1px solid var(--line); border-radius: 6px;
            color: var(--dim); font: inherit; }
    #more:hover, #more:focus-visible { color: var(--fg); border-color: var(--fg); }
    #empty { color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <h1>
      <a href="./">
        <img src="./assets/logo_full-128.png" alt="fanM" width="88" height="34">
      </a>
    </h1>
    <p>AIがつくり続けるMSX2風のデモ</p>
    <p><a id="random" href="#" hidden>ランダム再生</a></p>
  </header>
  <main>
    <section id="stage" hidden>
      <p id="bar">
        <span id="now"></span>
        <a id="close" href="#">&times; 一覧に戻る</a>
      </p>
    </section>
    <p id="empty" hidden>まだ作品がありません。</p>
    <ul id="catalog"></ul>
    <button id="more" type="button" hidden></button>
  </main>
  <script type="module" src="./src/catalog.ts"></script>
</body>
</html>
