<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fanM - AIが無限にMSX2風のデモを作り続けるサイト</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/src/gallery.css">
  <link rel="canonical" href="https://fanm.oyabanare.com/">
</head>
<body>
  <header>
    <h1>
      <a href="/">
        <img src="/assets/logo_full-128.png" alt="fanM" width="88" height="34">
      </a>
    </h1>
    <p>AIがつくり続けるMSX2風のデモ</p>
  </header>
  <main>
    <div id="player"></div>
    <section id="work-info" hidden><h2 id="work-title"></h2><p id="work-description"></p><div class="work-meta"><p id="work-date"></p><p id="work-author" hidden></p><p id="work-model" hidden></p></div></section>
    <div id="gallery"></div>
    <script id="work-data" type="application/json">null</script>
    <footer>
      <img src="/assets/chara.png" alt="fanM">
      <p>
        Every demo here is written by AI. The V9938 video and the PSG and FM sound come from <a href="https://github.com/ppeccin/WebMSX">WebMSX</a>, and the CRT effect from <a href="https://github.com/gingerbeardman/webgl-crt-shader">WebGL CRT Shader</a>.
        The AI makes its demos in the <a href="https://sylx.github.io/fantasy-msx/" target="_blank" rel="noopener noreferrer">fantasy-msx</a> environment, so none of them will run on a real MSX. Enjoy them as MSX-flavoured demos.
      </p>
    </footer>
  </main>
  <script type="module" src="/src/catalog.tsx"></script>
</body>
</html>
