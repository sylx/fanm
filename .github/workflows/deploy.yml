# main に push されたら、型検査を通してから chevron の Coolify に配り直させる。
#
# GitHub から Coolify の webhook を直接叩かせることもできるが、ここを通すと
# 型検査に落ちた push は配られない。tsx は型を見ずに動かすので、型の壊れた版でも
# イメージはできてしまう。止めるならここしかない。
#
# 要る秘密（Settings → Secrets and variables → Actions）:
#   COOLIFY_WEBHOOK_URL     http://<chevron>:8000/webhooks/source/github/events/manual
#   COOLIFY_WEBHOOK_SECRET  Coolify のアプリ（fanM Batch）の Webhooks タブにあるもの
#
# 秘密は本文ではなく署名に使う。Coolify は GitHub と同じ作法で、本文の HMAC-SHA256 を
# X-Hub-Signature-256 として受け取り、アプリに登録された秘密と突き合わせる。
#
# 本文は GitHub の push イベントを名乗る最小限のもの。Coolify が見るのは、どの
# リポジトリのどの枝か、それと commits の中身（[skip ci] / [skip cd] を含む
# コミットだけなら配らない）。commits を省くと Coolify が 500 を返す。

name: deploy

on:
  push:
    branches: [main]
    # 配り直すと常駐が入れ替わり、作っている途中なら呼出しが一つ無駄になる。
    # イメージの中身が変わらないもの（読み物）では配らない。prompts/ と
    # templates/ は .md でもAIへ渡すものなので、ここには入れない。
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

# 続けて push したときは、最後のものだけ配れば足りる。
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 型検査は engine/fantasy-msx のソースまで見る
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 型検査
        run: npm run typecheck

      - name: Coolify に配り直させる
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          # 中身をそのまま渡す（コミットの文に何が書いてあっても壊れないよう jq に組ませる）
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "COOLIFY_WEBHOOK_URL と COOLIFY_WEBHOOK_SECRET を Actions の秘密に入れる" >&2
            exit 1
          fi

          body=$(jq -nc \
            --arg ref "refs/heads/$BRANCH" \
            --arg full "$REPO" \
            --argjson id "$REPO_ID" \
            --arg message "${MESSAGE:-}" \
            '{
              ref: $ref,
              repository: { id: $id, full_name: $full, html_url: ("https://github.com/" + $full) },
              commits: [ { message: $message, added: [], removed: [], modified: [] } ]
            }')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')

          response=$(curl --fail-with-body -sS -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            -d "$body")
          echo "$response"

          # Coolify は断るときも 200 を返す（該当するアプリが無い、署名が違う、など）。
          # 配り直しが始まったか、[skip ci] で見送られたときだけ通す。
          echo "$response" | jq -e 'if type == "array" then any(.[]; .status == "success" or .status == "skipped") else false end' > /dev/null \
            || { echo "配り直しは始まらなかった" >&2; exit 1; }
